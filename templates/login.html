<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VI Triage · Sign in</title>
<style>
  :root{--bg:#0b0d12;--panel:#141821;--line:#262c38;--text:#e8ebf1;--muted:#9aa3b2;--accent:#f0a93b;--err:#e05563}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
  form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  h1 span{color:var(--accent)}
  p{color:var(--muted);margin:0 0 20px;font-size:13px}
  label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0e1118;color:var(--text);font-size:15px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#1a1205;font-weight:700;font-size:15px;cursor:pointer}
  .err{background:rgba(224,85,99,.12);border:1px solid var(--err);color:#f3b7be;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>VI Triage <span>· Sign in</span></h1>
  <p>Tender triage for the Vision Intelligence team.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="name">Your name</label>
  <input id="name" name="name" list="names" autocomplete="name" required>
  <datalist id="names">{% for n in names %}<option value="{{ n }}">{% endfor %}</datalist>
  <label for="password">Team password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
